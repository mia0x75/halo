	"""
	管理员删除群集，如果没有任何工单产生
	"""
	removeCluster(
		"""
		群集唯一标识符
		"""
		id: ID!
	): Boolean! @auth(requires: [ADMIN])

	"""
	修改群集状态
	"""
	patchClusterStatus(
		"""
		群集及状态值
		"""
		input: PatchClusterStatusInput!
	): Boolean! @auth(requires:[ADMIN])

	"""
	修改邮件模板
	"""
	updateTemplate(
		"""
		邮件模板信息
		"""
		input: UpdateTemplateInput
	): Template! @auth(requires:[ADMIN])

	"""
	开发创建新工单  
	"""
	createTicket(
		"""
		新建工单信息
		"""
		input: CreateTicketInput!
	): Ticket @auth(requires: [DEVELOPER])

	"""
	开发修改已存在工单
	"""
	updateTicket(
		"""
		现有工单信息
		"""
		input: UpdateTicketInput!
	): Ticket @auth(requires: [DEVELOPER])

	"""
	开发删除工单，如果工单状态允许删除
	"""
	removeTicket(
		"""
		工单唯一标识符
		"""
		id: ID!
	): Boolean! @auth(requires: [DEVELOPER, ADMIN])

	"""
	修改工单状态
	"""
	patchTicketStatus(
		"""
		工单唯一标识符、状态
		"""
		input:PatchTicketStatusInput!
	): Boolean! @auth(requires: [DEVELOPER, ADMIN])

	"""
	立刻执行一个工单
	"""
	executeTicket(
		"""
		工单唯一标识符
		"""
		id: ID!
	): Boolean! @auth(requires: [REVIEWER])

	"""
	预约执行一个工单
	TODO: 需要返回任务信息
	"""
	scheduleTicket(
		"""
		预约信息
		"""
		input: ScheduleTicketInput!
	): Cron @auth(requires: [REVIEWER])

	"""
	取消已预约执行的工单，并关闭
	"""
	cancelCron(
		"""
		工单唯一标识符
		"""
		id: ID!
	): Boolean! @auth(requires: [REVIEWER, ADMIN])

	"""
	工单的开发或者审核人添加审核意见
	"""
	createComment(
		"""
		新建审核意见信息
		"""
		input: CreateCommentInput!
	): Comment @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	管理员修改规则的值
	"""
	patchOptionParameters(
		"""
		修改后的规则值
		"""
		input: PatchOptionParameterInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	管理员修改规则的值
	"""
	patchRuleParameters(
		"""
		修改后的规则值
		"""
		input: PatchRuleParametersInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	管理员关闭或者启用规则
	"""
	patchRuleBitwise(
		"""
		是否允许规则执行
		"""
		input:PatchRuleBitwiseInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	开发查询数据库
	"""
	createQuery(
		"""
		新建查询信息
		"""
		input: CreateQueryInput!
	): String! @auth(requires: [DEVELOPER])

	"""
	查询分析及优化建议
	"""
	analyzeQuery(
		"""
		待分析优化的查询
		"""
		input: SoarQueryInput!
	): String! @auth(requires: [DEVELOPER, REVIEWER, ADMIN])

	"""
	根据规则重写查询语句
	"""
	rewriteQuery(
		"""
		待重写的查询语句
		"""
		input: SoarQueryInput!
	): String! @auth(requires: [DEVELOPER, REVIEWER, ADMIN])

	"""
	用户激活
	"""
	activate(
		input: ActivateInput!
	): ActivatePayload

	"""
	忘记密码
	"""
	lostPasswd(
		input: LostPasswdInput!
	): Boolean!

	"""
	重置密码
	"""
	resetPasswd(
		input: ResetPasswdInput!
	): Boolean!

	"""
	重置密码
	"""
	resendActivationMail(
		input: ActivateInput! # 原来的激活码，解开反序列化断言后，重新设置过期时间
	): Boolean!
}
