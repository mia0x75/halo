	获取当前用户的站内消息
	"""
	messages(
		"""
		只返回未读消息
		"""
		unreadOnly: Boolean

		"""
		返回条数上限
		"""
		first: Int
	): [Message] @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	当前用户的未读消息数
	"""
	unreadMessageCount: UInt! @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	获取规则命中明细
	"""
	ruleHits(
		"""
		工单编号，缺省返回全部工单
		"""
		TicketID: UInt

		"""
		规则名，缺省返回全部规则
		"""
		Rule: String

		"""
		严重程度，缺省返回全部级别
		"""
		Level: UInt8

		"""
		返回条数上限
		"""
		first: Int
	): [RuleHit] @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	按严重程度统计规则命中次数
	"""
	ruleHitLevels(
		"""
		统计起点，UNIX 秒
		"""
		from: UInt

		"""
		统计终点，UNIX 秒
		"""
		to: UInt
	): [RuleHitCount] @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	按规则统计命中次数
	"""
	ruleHitRules(
		"""
		统计起点，UNIX 秒
		"""
		from: UInt

		"""
		统计终点，UNIX 秒
		"""
		to: UInt

		"""
		返回条数上限
		"""
		first: Int
	): [RuleHitCount] @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	获取指标信息
	"""
	metrics(
		"""
		作用域，缺省返回全部作用域
		"""
		Scope: UInt8

		"""
		指标名称列表，缺省返回全部指标
		"""
		Names: [String!]
	): [Metric] @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	服务器当前信息
	"""
	environments: Environments

	metadata(
		"""
		群集的UUID
		"""
		ClusterUUID: String!

		"""
		具体的数据库
		"""
		database: String!
	): String! @auth(requires: [DEVELOPER, REVIEWER, ADMIN])

	"""
	测试数据库群集的连接性
	"""
	testCluster(
		"""
		连接信息
		"""
		input: ValidateConnectionInput!
	): ClusterTestResult! @auth(requires: [ADMIN])

	"""
	测试正则表达式的有效性
	"""
	testRegexp(
		"""
		正则表达式
		"""
		input: ValidatePatternInput
	): Boolean! @auth(requires: [ADMIN])
}

