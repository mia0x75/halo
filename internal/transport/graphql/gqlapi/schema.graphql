# 人口

"""
系统入口
"""
schema {
	query:        QueryRoot
	mutation:     MutationRoot
	subscription: SubscriptionRoot
}

# Directive定义

"""
用户权限管理
"""
directive @auth(
	"""
	权限要求
	"""
	requires: [RoleEnum!]!
) on QUERY | MUTATION | FIELD_DEFINITION | SUBSCRIPTION

"""
把GraphQL中定义的Enum的枚举值从String类型适配到Int类型
"""
directive @enumInt(
	"""
	枚举值对应的整数值
	"""
	value: Int!
) on ENUM_VALUE

"""
把源字符串转成大写
"""
directive @upper on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
把源字符串转成小写
"""
directive @lower on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
把UNIX_TIMESTAMP转化成日期时间字符串
"""
directive @timestamp(
	"""
	日期格式
	"""
	format: String! = "yyyy-MM-dd"
) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
把普通字段用md5算法转成UUID
"""
directive @uuid(
	# 新生成的属性名称，默认UUID
	name: String = "UUID"
	# 计算UUID属性相关的属性
	from: [String] = ["id"]
) on OBJECT

"""
日期格式转换
"""
directive @date(
	"""
	日期格式
	"""
	format: String! = "yyyy-MM-dd"
) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
字符串长度限制
"""
directive @length(
	"""
	允许的最大长度
	"""
	max: Int!
) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
数字范围限制
"""
directive @range(
	"""
	最小值
	"""
	begin: Int!,
	"""
	最大值
	"""
	end: Int!
) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
字符串正则匹配限制
"""
directive @matches(
	"""
	需要匹配的正则表达式
	"""
	pattern: String!
) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
字符串去首尾空格
"""
directive @trim on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
属性改名
"""
directive @rename(
	"""
	输入字符串
	"""
	to: String!
) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

union Searchable = User | Ticket | Cluster

