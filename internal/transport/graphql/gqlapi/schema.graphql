"""
数据修改入口
"""
type MutationRoot {
	"""
	用户注册
	"""
	register(
		"""
		注册信息
		"""
		input: UserRegisterInput!
	): User!

	"""
	用户登录
	"""
	login(
		"""
		登录信息
		"""
		input: UserLoginInput!
	): LoginPayload

	"""
	用户登出
	"""
	logout: Boolean! @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	把一条消息标记为已读
	"""
	markMessageRead(
		"""
		消息的UUID
		"""
		uuid: ID!
	): Boolean @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	把当前用户的全部未读消息标记为已读
	"""
	markAllMessagesRead: Int! @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	用户获取个人信息
	"""
	updateProfile(
		"""
		更新信息
		"""
		input: UpdateProfileInput!
	): User @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	用户自行更新密码
	"""
	updatePassword(
		"""
		新旧密码信息
		"""
		input: PatchPasswordInput!
	): Boolean! @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	用户自行更新登录账号
	"""
	updateEmail(
		"""
		新旧邮件地址信息
		"""
		input: PatchEmailInput!
	): Boolean! @auth(requires: [USER, DEVELOPER, REVIEWER, ADMIN])

	"""
	关联用户到审核人
	"""
	grantReviewers(
		"""
		即将关联的审核人
		"""
		input: GrantReviewersInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	收回用户到审核人
	"""
	revokeReviewers(
		"""
		即将收回的审核人
		"""
		input: RevokeReviewersInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	关联用户到群集
	"""
	grantClusters(
		"""
		即将关联的群集
		"""
		input: GrantClustersInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	收回用户到群集
	"""
	revokeClusters(
		"""
		即将收回的群集
		"""
		input: RevokeClustersInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	创建一个系统定时作业
	"""
	createCron(
		"""
		作业信息
		"""
		input: CreateCronInput!
	): Cron @auth(requires: [ADMIN])

	"""
	删除一个系统定时作业
	"""
	removeCron(
		"""
		作业UUID
		"""
		id: ID!
	): Boolean @auth(requires: [ADMIN])

	"""
	创建群集分组
	"""
	createGroup(
		"""
		分组信息
		"""
		input: CreateGroupInput!
	): Group @auth(requires: [ADMIN])

	"""
	更新群集分组
	"""
	updateGroup(
		"""
		分组信息
		"""
		input: UpdateGroupInput!
	): Group @auth(requires: [ADMIN])

	"""
	删除群集分组
	"""
	removeGroup(
		"""
		分组UUID
		"""
		id: ID!
	): Boolean @auth(requires: [ADMIN])

	"""
	关联角色到群集分组
	"""
	grantGroups(
		"""
		即将关联的分组
		"""
		input: GrantGroupsInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	收回角色到群集分组的关联
	"""
	revokeGroups(
		"""
		即将收回的分组
		"""
		input: GrantGroupsInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	关联用户到角色
	"""
	grantRoles(
		"""
		即将关联的角色
		"""
		input: GrantRolesInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	收回用户到角色
	"""
	revokeRoles(
		"""
		即将收回的角色
		"""
		input: RevokeRolesInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	在后台有管理员直接创建用户
	"""
	createUser(
		"""
		创建用户需要的信息
		"""
		input: CreateUserInput!
	): User @auth(requires: [ADMIN])

	"""
	在后台有管理员直接更新用户
	"""
	updateUser(
		"""
		更新用户需要的信息
		"""
		input: UpdateUserInput!
	): User @auth(requires: [ADMIN])

	"""
	在后台有管理员直接调整用户状态
	"""
	patchUserStatus(
		"""
		用户状态信息
		"""
		input:PatchUserStatusInput!
	): Boolean! @auth(requires: [ADMIN])

	"""
	管理员创建群集
	"""
	createCluster(
		"""
		新建群集信息
		"""
		input: CreateClusterInput!
	): Cluster @auth(requires: [ADMIN])

	"""
	管理员修改群集
	"""
