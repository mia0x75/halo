"""
工单分解后的语句集
"""
type Statement implements Node {
	"""
	语句的UUID
	"""
	UUID:         ID!

	"""
	语句所属工单的自增ID
	"""
	TicketID:     UInt!

	"""
	语句的顺序ID
	"""
	Sequence:     UInt16!  @range(begin: 1, end: 65535)

	"""
	语句的具体内容
	"""
	Content:      String! @length(max: 65535)

	"""
	语句的类型，这个有抽象语法树决定
	"""
