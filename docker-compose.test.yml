# Throwaway metadata databases for integration tests.
#
#   make test-db-up      start both engines (MySQL 3307 / PG 5433)
#   make test-all        bring up, run tests, tear down
#
# Not for production. Data is ephemeral; schema+seed are replayed on first
# boot only, so recreate the volume when the seed changes.
name: halo-test

services:
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: halo-test-mysql
    # The repo seed predates MySQL strict mode and overflows a VARCHAR; the dev
    # MariaDB is non-strict, so mirror that here instead of rewriting the seed.
    command: ["--sql-mode=NO_ENGINE_SUBSTITUTION"]
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: halo_test
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./scripts/halodb_schema_mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:Z
      - ./scripts/halodb_seed_mysql.sql:/docker-entrypoint-initdb.d/02-seed.sql:Z
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -ptest -e 'SELECT 1 FROM halo_test.mm_avatars LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 30

  postgres:
    image: docker.io/library/postgres:16
    container_name: halo-test-postgres
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: halo_test
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./scripts/halodb_schema_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:Z
      - ./scripts/halodb_seed_postgres.sql:/docker-entrypoint-initdb.d/02-seed.sql:Z
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d halo_test -tAc 'SELECT 1 FROM mm_avatars LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 30
