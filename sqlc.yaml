version: "2"
sql:
  - engine: "mysql"
    queries: "internal/repository/mysql/queries"
    schema: "scripts/halodb_schema_mysql.sql"
    gen:
      go:
        package: "mysqlrepo"
        out: "internal/repository/mysql"
        sql_package: "database/sql"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: false
        emit_db_tags: false
        overrides:
          - db_type: "tinyint"
            go_type: "uint8"
          - db_type: "smallint"
            go_type: "uint16"
          - db_type: "int"
            go_type: "int64"
          - db_type: "bigint"
            go_type: "int64"
  - engine: "postgresql"
    queries: "internal/repository/postgres/queries"
    schema: "scripts/halodb_schema_postgres.sql"
    gen:
      go:
        package: "postgresrepo"
        out: "internal/repository/postgres"
        sql_package: "database/sql"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: false
        emit_db_tags: false
        overrides:
          - db_type: "numeric"
            go_type: "string"
