name: Code Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 同一分支/PR 上旧的扫描在有新提交时自动取消，节省额度
concurrency:
  group: code-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # CodeQL 上传结果需要
  actions: read

jobs:
  # 1. CodeQL SAST，结果上传到 Security 面板
  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: none            # Go 纯静态分析，无需编译；若失败可删本行改用自动构建
          queries: security-and-quality   # 含安全 + 代码质量规则集

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"

  # 2. 轻量静态检查
  go-static-check:
    name: Go static check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
